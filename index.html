<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個人化運動賽程規劃工具</title>

<!-- Space Grotesk (free, SIL OFL) for big numbers; offline it falls back to the system font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens — "Magazine Matchday" design system (see design-system/DESIGN.md).
     Change colors / sizes here; everything below reads these variables.
     ===================================================================== */
  :root {
    color-scheme: light dark;          /* native scrollbars, date/time pickers follow the theme */
    /* Fonts */
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --font-num: "Space Grotesk", -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
    /* Type scale (px) */
    --fs-display: 32px; --fs-time: 34px; --fs-score: 24px; --fs-team: 18px; --fs-date: 18px;
    --fs-body: 16px; --fs-label: 14px; --fs-caption: 13px; --fs-micro: 12px;
    /* Spacing: multiples of 4 / 8 */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
    /* Shape (M3 corner scale) */
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 999px;
    --tap: 44px;                       /* minimum touch target (Apple 44pt) */
    /* Colors — light */
    --color-bg: #F1EFEA;               /* page background (warm paper) */
    --color-surface: #FFFFFF;          /* cards, dialog */
    --color-surface-2: #F7F5F1;        /* inner sections, neutral chips */
    --color-text: #1C1B19;             /* main text */
    --color-text-muted: #57534C;       /* secondary text */
    --color-outline: #8A847A;          /* input / button borders (≥3:1) */
    --color-divider: #E2DED5;          /* decorative lines only */
    --color-primary: #C9431A;          /* orange vermilion: main action, sport label, live */
    --color-on-primary: #FFFFFF;
    --color-primary-container: #FCE4D8;
    --color-on-primary-container: #6B230A;
    --color-secondary: #34495E;        /* slate: selected day, "勝" badge */
    --color-on-secondary: #FFFFFF;
    --color-secondary-container: #DDE5EE;
    --color-on-secondary-container: #1B2A3A;
    --color-warn-container: #FFEBC7;   /* time TBD, postponed */
    --color-on-warn-container: #5C3A00;
    --color-scrim: rgba(20, 18, 15, .5);
    --color-banner: #26231F;           /* header banner background (warm ink) */
    --color-on-banner: #F3F1EC;        /* title on the banner */
    --color-on-banner-accent: #FF8A5C; /* tagline on the banner */
    --color-on-banner-muted: #C9C3B7;  /* kickoff window, update time on the banner */
  }
  /* Colors — dark (follows the system setting) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #121211; --color-surface: #1D1C1A; --color-surface-2: #262522;
      --color-text: #F3F1EC; --color-text-muted: #ADA89E; --color-outline: #77726A; --color-divider: #33312D;
      --color-primary: #FF8A5C; --color-on-primary: #2A0B00;
      --color-primary-container: #4A1F10; --color-on-primary-container: #FFD4C2;
      --color-secondary: #C9D6E3; --color-on-secondary: #15202B;
      --color-secondary-container: #2A3846; --color-on-secondary-container: #DDE5EE;
      --color-warn-container: #3E2F12; --color-on-warn-container: #FFDB9A;
      --color-scrim: rgba(0, 0, 0, .6);
      --color-banner: #262522; --color-on-banner: #F3F1EC; --color-on-banner-accent: #FF8A5C; --color-on-banner-muted: #ADA89E;
    }
  }
  /* Phones: larger body text (iOS default 17) and a smaller headline */
  @media (max-width: 599px) {
    :root { --fs-display: 28px; --fs-time: 30px; --fs-body: 17px; }
  }

  /* ===== Base ===== */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text);
    font: var(--fs-body)/1.6 var(--font-ui); -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 880px; margin: 0 auto; padding: var(--sp-2) var(--sp-4) 64px; }
  h1 { font: 700 var(--fs-display)/1.05 var(--font-num); letter-spacing: -.03em; margin: 0; }
  .sub { color: var(--color-text-muted); font-size: var(--fs-label); margin-top: var(--sp-1); }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--sp-3); flex-wrap: wrap; }
  /* Header banner: full-width band, content aligned with the page column */
  .banner { background: var(--color-banner); color: var(--color-on-banner); border-bottom: 3px solid var(--color-primary); }   /* primary accent line */
  .banner-in { max-width: 880px; margin: 0 auto; padding: var(--sp-8) var(--sp-4) var(--sp-6); }
  .tagline { margin: var(--sp-2) 0 0; font-size: var(--fs-team); font-weight: 600; color: var(--color-on-banner-accent); }
  .banner .sub, .banner .sync { color: var(--color-on-banner-muted); }
  .banner .sub { margin-top: var(--sp-1); }
  .banner .sync button { background: transparent; color: var(--color-on-banner); border-color: var(--color-on-banner-muted); }
  .banner .sync button:hover { border-color: var(--color-on-banner); }
  .sync { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-caption); color: var(--color-text-muted); }
  .sync button { min-height: 36px; padding: 0 var(--sp-3); font-size: var(--fs-caption); }
  :focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }

  /* ===== Buttons & inputs ===== */
  button, select { font: inherit; font-size: var(--fs-label); font-weight: 600; color: var(--color-text);
    background: var(--color-surface); border: 1px solid var(--color-outline); border-radius: var(--r-full);
    min-height: 36px; padding: 0 var(--sp-4); cursor: pointer; }
  button:hover, select:hover { border-color: var(--color-text); }
  button.primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: wait; }
  select { padding: 0 var(--sp-3); border-radius: var(--r-sm); }
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin: var(--sp-4) 0 var(--sp-3); }
  .range { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); font-size: var(--fs-label); color: var(--color-text-muted); }
  .range input[type=date], input[type=time] { font: inherit; font-size: var(--fs-label); color: var(--color-text);
    background: var(--color-surface); border: 1px solid var(--color-outline); border-radius: var(--r-sm);
    min-height: 36px; padding: 0 var(--sp-2); }
  /* Date field: a calendar icon on the right shows it can be tapped (iOS shows no picker hint) */
  .date-field { position: relative; display: inline-flex; align-items: center; }
  .date-field input[type=date] { padding-right: 36px; cursor: pointer; -webkit-appearance: none; appearance: none; }
  .date-field input[type=date]:hover { border-color: var(--color-text); }
  /* The browser writes the date in its own locale format (iPhone: 2026年10月19日); hide it and show ours */
  .date-field input[type=date] { color: transparent; min-width: 150px; }
  .date-field input::-webkit-datetime-edit { color: transparent; }
  .date-field .date-text { position: absolute; left: 0; padding-left: var(--sp-3); font-size: var(--fs-label);
    color: var(--color-text); font-variant-numeric: tabular-nums; pointer-events: none; }
  .date-field .cal { position: absolute; right: 10px; margin: 0; color: var(--color-text-muted); pointer-events: none; }
  /* Chrome/Edge: hide the built-in icon but keep it clickable over ours */
  .date-field input::-webkit-calendar-picker-indicator { position: absolute; right: 0; top: 0; width: 36px; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; }
  .date-field input::-webkit-date-and-time-value { text-align: left; }
  .spacer { flex: 1; }

  /* ===== Notices & summary ===== */
  .notice { background: var(--color-warn-container); color: var(--color-on-warn-container); border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-4); font-size: var(--fs-label); margin: var(--sp-2) 0; }
  .summary { margin: var(--sp-4) 0 var(--sp-2); color: var(--color-text-muted); font-size: var(--fs-label); }

  /* ===== Day tabs: date is smaller than kickoff time on purpose ===== */
  .tabs { display: flex; gap: var(--sp-2); overflow-x: auto; padding: 2px 2px var(--sp-2); scrollbar-width: thin; }
  .tab { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 84px; min-height: 60px; padding: var(--sp-1) var(--sp-3); border-radius: var(--r-lg);
    border: 1px solid var(--color-divider); background: var(--color-surface); line-height: 1.25; font-weight: 400; }
  .tab .d { font: 600 var(--fs-date)/1.2 var(--font-num); letter-spacing: -.01em; }
  .tab .n { font-size: var(--fs-micro); color: var(--color-text-muted); }
  .tab.empty-day .d { color: var(--color-text-muted); }
  .tab.today { border: 2px solid var(--color-primary); }
  .tab.active { background: var(--color-secondary); border-color: var(--color-secondary); color: var(--color-on-secondary); }
  .tab.active .d, .tab.active .n { color: var(--color-on-secondary); }
  .day-list { margin-top: var(--sp-3); }

  /* ===== Match card ===== */
  .item { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: var(--sp-4); background: var(--color-surface);
    border-radius: var(--r-lg); padding: var(--sp-4) 18px; margin-bottom: var(--sp-3); }
  .when { font: 700 var(--fs-time)/1 var(--font-num); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .when small { display: block; font: 500 var(--fs-caption)/1.4 var(--font-ui); color: var(--color-text-muted); letter-spacing: 0; margin-top: var(--sp-1); }
  .when.tbd { font-size: 26px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); margin-bottom: var(--sp-2); }
  .comp { font-size: var(--fs-label); font-weight: 600; color: var(--color-text-muted); }
  .comp em { font-style: normal; color: var(--color-primary); }
  .statuses { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--sp-1); flex: none; max-width: 50%; }
  .status { font-size: var(--fs-caption); font-weight: 600; padding: 2px 10px; border-radius: var(--r-full);
    background: var(--color-surface-2); color: var(--color-text-muted); white-space: nowrap; }
  .status.warn { background: var(--color-warn-container); color: var(--color-on-warn-container); }
  .status.live { background: var(--color-primary-container); color: var(--color-on-primary-container); }
  .status.live::before { content: "● "; color: var(--color-primary); }
  /* Two sides stacked, scores right-aligned in their own column */
  .sides { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; column-gap: var(--sp-3); align-items: center; }
  .side { display: flex; align-items: center; gap: 10px; font-size: var(--fs-team); font-weight: 700; min-width: 0; }
  .side .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side.lose { color: var(--color-text-muted); font-weight: 500; }
  .side img { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .win { font: 700 var(--fs-micro)/1 var(--font-ui); padding: 4px 7px; border-radius: var(--r-full); flex: none;
    background: var(--color-secondary); color: var(--color-on-secondary); }
  .win.draw { background: var(--color-secondary-container); color: var(--color-on-secondary-container); }
  .pts { display: flex; gap: var(--sp-3); justify-content: flex-end; font: 700 var(--fs-score)/1 var(--font-num); font-variant-numeric: tabular-nums; }
  .pts span { min-width: 18px; text-align: right; }
  .pts sup { font-size: var(--fs-micro); font-weight: 500; }
  .side.lose + .pts { color: var(--color-text-muted); font-weight: 500; }
  .f1-name { font-size: var(--fs-team); font-weight: 700; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-divider); font-size: var(--fs-label); color: var(--color-text-muted); }
  .foot a.stats { color: var(--color-text); font-weight: 600; text-decoration: underline; text-underline-offset: 4px;
    min-height: 32px; display: inline-flex; align-items: center; margin-left: auto; }
  .foot a.stats:hover { color: var(--color-primary); }
  /* inline-block keeps the arrow out of the underline */
  .foot a.stats .arr { display: inline-block; margin-left: var(--sp-1); text-decoration: none; }
  .empty { color: var(--color-text-muted); padding: var(--sp-8) 0; text-align: center; }
  .empty button { margin-top: var(--sp-3); }
  @media (max-width: 599px) {
    .item { grid-template-columns: 1fr; gap: 10px; padding: 14px var(--sp-4); }
    .when { display: flex; align-items: baseline; gap: var(--sp-2); }
    .when small { margin: 0; }
  }

  /* ===== Standings sidebar ===== */
  .standings { background: var(--color-surface); border-radius: var(--r-lg); padding: var(--sp-4); margin-top: var(--sp-6); }
  .st-title { font-size: var(--fs-team); margin: 0 0 var(--sp-3); }
  .st-tabs { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
  .st-tab { background: none; border-color: transparent; color: var(--color-text-muted); padding: 0 var(--sp-3); }
  .st-tab:hover { color: var(--color-text); border-color: var(--color-divider); }
  .st-tab.active { background: var(--color-secondary); border-color: var(--color-secondary); color: var(--color-on-secondary); }
  .st-tab .emoji { margin-right: 4px; }
  .st-sub { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin: var(--sp-3) 0 var(--sp-2); }
  .st-sub select { width: 100%; }
  .st-sub button { font-weight: 500; }
  .st-sub button.on { background: var(--color-secondary-container); border-color: var(--color-secondary); color: var(--color-on-secondary-container); }
  .st-table { width: 100%; border-collapse: collapse; font-size: var(--fs-label); }
  .st-table th { font-size: var(--fs-micro); font-weight: 600; color: var(--color-text-muted); text-align: right; padding: var(--sp-1) 6px; border-bottom: 1px solid var(--color-divider); white-space: nowrap; }
  .st-table td { padding: 6px; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--color-divider); white-space: nowrap; }
  .st-table th.nm, .st-table td.nm { text-align: left; width: 100%; }
  .st-table td.nm { max-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .st-table td.nm img { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; margin-right: 6px; }
  .st-table td.nm .tdot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 9px 0 3px; vertical-align: -1px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }   /* team color dot; the ring keeps white (Williams) visible */
  .st-table td.rk { font: 600 var(--fs-label) var(--font-num); color: var(--color-text-muted); }
  .st-table td.st-pts { font-weight: 700; }
  .st-table tr.mine td { background: var(--color-secondary-container); color: var(--color-on-secondary-container); }
  .st-table tr.mine td.rk { color: inherit; }
  .st-table tr.gap td { text-align: center; color: var(--color-text-muted); border-bottom: none; padding: 2px; }
  .st-note { margin-top: var(--sp-2); }
  .st-msg { color: var(--color-text-muted); font-size: var(--fs-label); padding: var(--sp-4) 0; }
  /* Wide screens: schedule on the left, standings on the right (sticky, scrolls on its own) */
  @media (min-width: 1200px) {
    .wrap { max-width: 1240px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--sp-6); align-items: start; }
    .banner-in { max-width: 1240px; }
    .standings { margin-top: var(--sp-4); position: sticky; top: var(--sp-4); max-height: calc(100vh - 32px); overflow-y: auto; }
  }

  /* ===== Filter dialog ===== */
  dialog.filters { width: min(760px, calc(100vw - 32px)); max-height: 85vh; padding: 0; overflow: hidden;
    background: var(--color-surface); color: var(--color-text); border: none; border-radius: var(--r-xl); }
  dialog.filters::backdrop { background: var(--color-scrim); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-6);
    border-bottom: 1px solid var(--color-divider); }
  .dlg-head h2 { font-size: 20px; margin: 0; }
  .dlg-body { padding: var(--sp-1) var(--sp-6) var(--sp-6); overflow-y: auto; max-height: calc(85vh - 77px); }
  .dlg-actions { display: flex; gap: var(--sp-2); align-items: center; }
  /* "完成" is greyed out and unclickable until something changes */
  #closeFilters:disabled { background: var(--color-surface-2); border-color: var(--color-divider); color: var(--color-text-muted); opacity: 1; cursor: not-allowed; }
  .settings-btns { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .fsection { background: var(--color-surface-2); border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4) var(--sp-4); margin-top: var(--sp-4); }
  .fsection h3 { font-size: var(--fs-label); margin: 0; color: var(--color-text-muted); }
  .top-sections { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .top-sections .fsection { margin-top: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
  .top-sections .fgroup { margin-top: 0; }
  .top-sections #settingsMsg:empty { display: none; }
  .win-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); font-size: var(--fs-label); }
  @media (max-width: 599px) { .top-sections { grid-template-columns: 1fr; gap: 0; } }
  .sport-tabs { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-5); }
  .sport-tab { background: none; border-color: transparent; color: var(--color-text-muted); }
  .sport-tab:hover { color: var(--color-text); border-color: var(--color-divider); }
  .sport-tab.active { background: var(--color-secondary); border-color: var(--color-secondary); color: var(--color-on-secondary); }
  .sport-panel { display: none; margin-top: var(--sp-3); }
  .sport-panel.active { display: block; }
  .fgroup { margin-top: var(--sp-3); }
  .fgroup:empty { display: none; }
  .fgroup .ftitle { font-size: var(--fs-label); font-weight: 600; margin-bottom: var(--sp-2); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 1px solid var(--color-outline);
    background: var(--color-surface); border-radius: var(--r-full); padding: 0 var(--sp-3); font-size: var(--fs-label);
    cursor: pointer; user-select: none; }
  .chip input { margin: 0; accent-color: var(--color-secondary); }
  .chip.on { background: var(--color-secondary-container); border-color: var(--color-secondary); color: var(--color-on-secondary-container); }
  .chip img { width: 18px; height: 18px; object-fit: contain; }
  .chip .rank { color: var(--color-text-muted); font-size: var(--fs-micro); font-variant-numeric: tabular-nums; }
  .chip .hint { color: inherit; opacity: .75; }
  .chip .x { border: none; background: none; min-height: 32px; min-width: 32px; padding: 0; margin-right: -8px;
    color: inherit; font-size: var(--fs-label); line-height: 1; border-radius: var(--r-full); }
  .chip .x:hover { color: var(--color-primary); }
  .picker { background: var(--color-surface); border-radius: var(--r-md); padding: var(--sp-3); margin-top: var(--sp-2); }
  .picker-box summary { cursor: pointer; user-select: none; min-height: 32px; display: list-item; }
  .picker-box summary:hover { color: var(--color-primary); }
  .picker-box summary::marker { color: var(--color-primary); }
  .search-toggle { width: 44px; padding: 0; margin-left: auto; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .search-toggle .ico { margin-right: 0; }
  .search-toggle.on { background: var(--color-secondary); border-color: var(--color-secondary); color: var(--color-on-secondary); }
  .pick-search { width: 100%; min-height: 44px; margin-bottom: var(--sp-3); padding: 0 var(--sp-4); font-size: 16px; font-family: inherit;   /* 16px stops iPhone zooming in */
    color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-outline); border-radius: var(--r-full); }
  .pick-search:focus { outline: 2px solid var(--color-secondary); outline-offset: -1px; }
  .pick-search[hidden] { display: none; }
  .chip .group { margin-left: auto; color: var(--color-text-muted); font-size: var(--fs-micro); padding-left: var(--sp-2); white-space: nowrap; }
  .chip.on .group { color: inherit; opacity: .75; }
  /* Desktop: the followed list stays open, so its heading is plain text */
  @media (min-width: 600px) {
    .tracked-box > summary { list-style: none; cursor: default; }
    .tracked-box > summary::-webkit-details-marker { display: none; }
    .tracked-box > summary:hover { color: inherit; }
  }
  .pick-bar { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-3); }
  .pick-bar button:disabled { cursor: default; }
  .pick-bar select[hidden] { display: none; }
  .hint { color: var(--color-text-muted); font-size: var(--fs-caption); }
  .ico { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; flex: none; }
  .dlg-head h2 { display: flex; align-items: center; }
  .dlg-head h2 .ico { width: 20px; height: 20px; }
  .comp .emoji, .sport-tab .emoji { margin-right: 4px; font-size: 1.05em; }
  /* Touch screens (phone / tablet): every tappable thing at least 44px (Apple) — main buttons 48px (M3) */
  @media (pointer: coarse) {
    .chip, .foot a.stats, .picker-box summary { min-height: 44px; }
    .chip .x { min-width: 44px; min-height: 44px; margin-right: -12px; }
    button, select, .range input[type=date], .win-row select, .toolbar button, .settings-btns button, .sync button { min-height: var(--tap); }
  }
  /* Phones: narrower pill buttons (16px -> 12px side padding) */
  @media (max-width: 599px) {
    button { padding: 0 var(--sp-3); }
    .sync button { padding: 0 10px; }
    #openFilters .fb-label { display: none; }   /* icon + count only */
    #openFilters { padding: 0 var(--sp-4); }
    /* Date range: one full-width row, the two fields share the space, dates left-aligned */
    .range { display: flex; flex-wrap: nowrap; width: 100%; }
    .range .date-field { flex: 1; min-width: 0; }
    .range .date-field input[type=date] { width: 100%; min-width: 0; }
    .range .date-field .date-text { left: 0; right: 36px; text-align: left; }
    /* Filter pop-up: less nested padding, so names fit on one line */
    .dlg-head { padding: var(--sp-3) var(--sp-4); }
    .dlg-body { padding: var(--sp-1) var(--sp-3) var(--sp-4); }
    .fsection { padding: var(--sp-3); }
    .picker { background: none; padding: 0; }
    /* Followed list and picker: one item per row, all the same width */
    .pick-bar { flex-wrap: nowrap; }
    .pick-bar select { flex: 1; min-width: 0; }
    .pick-bar.two-selects { flex-wrap: wrap; }
    .pick-bar.two-selects select { flex: 1 1 calc(50% - var(--sp-2)); }
    .pick-bar button { flex: none; }
    .list-rows { flex-direction: column; flex-wrap: nowrap; gap: var(--sp-1); }
    .list-rows .chip { display: flex; width: 100%; }
    .list-rows .chip .hint { margin-left: auto; padding-left: var(--sp-2); }
  }
  /* Followed list: spacing set here (after the touch rules) so the empty message sits close to its heading */
  .tracked-box > summary.ftitle { margin-bottom: 0; }
  .tracked-box > .chips { margin-top: var(--sp-2); }
  .tracked-box > .chips.tracked-empty { margin-top: 10px; }
  #tennis-extra { margin-top: 14px; }
  .tracked-box > summary { min-height: 0; }
  @media (max-width: 599px) and (pointer: coarse) {
    .tracked-box > summary { min-height: 44px; line-height: 44px; }
    .tracked-box > .chips { margin-top: 0; }
    .tracked-box > .chips.tracked-empty { margin-top: 2px; }
  }
</style>

<body>
<header class="banner">
  <div class="banner-in top">
    <div>
      <h1>個人化運動賽程規劃工具</h1>
      <p class="tagline">打造你的專屬賽程</p>
      <div class="sub" id="windowText"></div>
    </div>
    <div class="sync">
      <span id="updated">尚未載入</span>
      <button id="refresh">↻ 更新</button>
    </div>
  </div>
</header>
<div class="wrap">
<main class="main">

  <div class="toolbar">
    <span class="range">
      <label class="date-field"><input type="date" id="rangeStart" aria-label="開始日期" required><span class="date-text" id="rangeStartText"></span><svg class="ico cal" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></label>
      <span>到</span>
      <label class="date-field"><input type="date" id="rangeEnd" aria-label="結束日期" required><span class="date-text" id="rangeEndText"></span><svg class="ico cal" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></label>
    </span>
    <button id="thisWeek">回到本週</button>
    <span class="spacer"></span>
    <button class="primary" id="openFilters">篩選器</button>
  </div>

  <dialog class="filters" id="filtersBox">
    <div class="dlg-head">
      <h2><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.6V19l-3.6-1.8v-4.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>篩選器</h2>
      <span class="dlg-actions">
        <button id="cancelFilters">取消</button>
        <button id="closeFilters" class="primary" disabled>完成</button>

    <div class="dlg-body">

    <div class="top-sections">
      <section class="fsection">
        <h3>開賽時間（台灣時間）</h3>

          <span>從</span>
          <select id="winStart" data-win="winStart" aria-label="開賽時間從"></select>
          <span>到</span>
          <select id="winEnd" data-win="winEnd" aria-label="開賽時間到"></select>

    <!-- Sport tabs and panels are built by buildSportPanels() from the SPORT_TABS / FOLLOW config. -->

    <div id="sportPanels"></div>
    </div>

  <div id="notices"></div>

<!-- Standings: right column on wide screens, below the schedule on narrow ones. Built by renderStandings(). -->
<aside class="standings" aria-label="排名">
  <h2 class="st-title">排名</h2>
  <div class="st-tabs" id="stTabs" role="tablist"></div>
  <div class="st-sub" id="stSub"></div>
  <div id="stTable"></div>

<script>
// =====================================================================
// CONFIG
// =====================================================================

// Default kickoff window in Taiwan time: 06:00 through 01:30 the next morning (inclusive).
// Each person can change it in the filter pop-up ("顯示" box); it is saved with the other filters.
const WINDOW_START_MIN = 6 * 60;      // 06:00
const WINDOW_END_MIN = 1 * 60 + 30;   // 01:30

// --- Soccer ---------------------------------------------------------
// Leagues offered in the team picker (ESPN slug -> display name).
// To offer another league, add its ESPN slug here (e.g. 'bel.1').
const PICKER_LEAGUES = {
  'eng.1': '英超', 'esp.1': '西甲', 'ger.1': '德甲', 'ita.1': '義甲', 'fra.1': '法甲',
  'ned.1': '荷甲', 'por.1': '葡超', 'sco.1': '蘇超', 'usa.1': '美職 MLS', 'ksa.1': '沙烏地職業聯賽',
};

// Chinese names for competitions. Anything not listed falls back to ESPN's English name.
const COMP_NAMES = {
  ...PICKER_LEAGUES,
  'uefa.champions': '歐冠', 'uefa.europa': '歐霸', 'uefa.europa.conf': '歐協聯', 'uefa.super_cup': '歐洲超級盃',
  'eng.fa': '英格蘭足總盃', 'eng.league_cup': '英格蘭聯賽盃', 'eng.charity': '英格蘭社區盾',
  'esp.copa_del_rey': '西班牙國王盃', 'esp.super_cup': '西班牙超級盃',
  'ger.dfb_pokal': '德國盃', 'ger.super_cup': '德國超級盃',
  'ita.coppa_italia': '義大利盃', 'ita.super_cup': '義大利超級盃',
  'fra.coupe_de_france': '法國盃', 'fra.super_cup': '法國超級盃',
  'ned.cup': '荷蘭盃', 'por.taca.portugal': '葡萄牙盃', 'sco.tennents': '蘇格蘭足總盃', 'sco.cis': '蘇格蘭聯賽盃',
  'club.friendly': '俱樂部友誼賽', 'fifa.cwc': '世界俱樂部盃',
};


// ESPN cup stage names -> display name (unknown stages are shown in English)
const STAGES = {
  'League Phase': '聯賽階段', 'Knockout Round Playoffs': '淘汰賽附加賽', 'Round of 16': '16 強',
  'Quarterfinals': '8 強', 'Semifinals': '準決賽', 'Final': '決賽',
  'First Round': '第一輪', 'Second Round': '第二輪', 'Third Round': '第三輪', 'Fourth Round': '第四輪',
  'Fifth Round': '第五輪', 'Round of 32': '32 強',
};

// Earlier versions stored Chinese names for these teams; they are switched to English on load.
const LEGACY_NAMES = {
  '132': 'Bayern Munich', '382': 'Manchester City', '83': 'Barcelona', '86': 'Real Madrid', '359': 'Arsenal',
};

// --- NBA ------------------------------------------------------------
const NBA_CONFS = { east: '東區', west: '西區' };
const NBA_TYPES = { preseason: '季前賽', regular: '例行賽', playoffs: '季後賽' };
// ESPN season type numbers -> our filter key (5 = play-in tournament, counted as playoffs)
const NBA_SEASON_TYPES = { 1: 'preseason', 2: 'regular', 3: 'playoffs', 5: 'playoffs' };

// --- MLB ------------------------------------------------------------
const MLB_LEAGUES = { al: '美聯', nl: '國聯' };
const MLB_TYPES = { 2: '例行賽', 3: '季後賽' };
// ESPN game notes like "ALDS - Game 3": series name -> display name (unknown ones are shown in English)
const MLB_SERIES = {
  ALWC: '美聯外卡系列賽', NLWC: '國聯外卡系列賽', ALDS: '美聯分區系列賽', NLDS: '國聯分區系列賽',
  ALCS: '美聯冠軍系列賽', NLCS: '國聯冠軍系列賽', 'World Series': '世界大賽', Doubleheader: '雙重賽',
};
function mlbNote(note) {
  const m = /^(.+) - Game (\d+)$/.exec(note);
  if (!m || !MLB_SERIES[m[1]]) return note;
  return `${MLB_SERIES[m[1]]} ${m[1] === 'Doubleheader' ? `第 ${m[2]} 場` : `第 ${m[2]} 戰`}`;
}

// --- NFL ------------------------------------------------------------
const NFL_CONFS = { afc: 'AFC', nfc: 'NFC' };
// ESPN week names -> display name; "Week 5" / "Preseason Week 2" are handled in nflWeek().
const NFL_WEEKS = {
  'Hall of Fame Weekend': '季前賽・名人堂賽', 'Wild Card': '季後賽・外卡輪', 'Divisional Round': '季後賽・分區輪',
  'Conference Championship': '季後賽・聯會冠軍賽', 'Super Bowl': '超級盃',
};
function nflWeek(text) {
  if (NFL_WEEKS[text]) return NFL_WEEKS[text];
  const m = /^(Preseason )?Week (\d+)$/.exec(text);
  return m ? `${m[1] ? '季前賽' : '例行賽'}・第 ${m[2]} 週` : text;
}

// ESPN standings table names of each conference / league (used by the picker lists and the standings sidebar).
const CONF_TABLES = { east: /East/, west: /West/, al: /American/, nl: /National/, afc: /American/, nfc: /National/ };

// --- Tennis ---------------------------------------------------------
const TENNIS_TOURS = { atp: 'ATP 男子', wta: 'WTA 女子' };
const TENNIS_ROUNDS = {
  'Qualifying 1st Round': '資格賽第一輪', 'Qualifying 2nd Round': '資格賽第二輪', 'Qualifying 3rd Round': '資格賽第三輪',
  'Qualifying Final': '資格賽決賽', 'Round 1': '第一輪', 'Round 2': '第二輪', 'Round 3': '第三輪', 'Round 4': '第四輪',
  'Round of 128': '128 強', 'Round of 64': '64 強', 'Round of 32': '32 強', 'Round of 16': '16 強',
  'Quarterfinal': '8 強', 'Semifinal': '準決賽', 'Final': '決賽',
};
const TENNIS_STATUS = { STATUS_RETIRED: '對手退賽', STATUS_WALKOVER: '不戰而勝', STATUS_CANCELED: '取消' };

// --- F1 -------------------------------------------------------------
// F1 session keys from the Jolpica API -> [display name, filter category]
const F1_SESSIONS = {
  FirstPractice:    ['第一次練習賽 FP1', 'practice'],
  SecondPractice:   ['第二次練習賽 FP2', 'practice'],
  ThirdPractice:    ['第三次練習賽 FP3', 'practice'],
  SprintQualifying: ['衝刺排位賽', 'qualifying'],
  SprintShootout:   ['衝刺排位賽', 'qualifying'],
  Sprint:           ['衝刺賽 Sprint', 'sprint'],
  Qualifying:       ['排位賽', 'qualifying'],
  Race:             ['正賽', 'race'],
};
const F1_CATEGORIES = { practice: '練習賽', qualifying: '排位賽', sprint: '衝刺賽', race: '正賽' };

// --- Sports in the filter pop-up -----------------------------------
// Data sources the user can follow teams / players from. To add one, add an entry here,
// then offer it as a league in SPORT_TABS below.
//   key:           where the followed list is kept in state / settings
//   label:         name in the summary line and on match cards
//   what:          what is followed (球隊, 選手)
//   teamUrls:      schedule requests of one team (sources fetched team by team)
//   eventFields:   source-specific fields of a normalized event
//   loadList:      fills the picker list of one group
//   cardLabels:    competition line and footer of a match card
//   draws:         a finished match without a winner is a draw ("和")
const FOLLOW = {
  soccer: {
    key: 'tracked', label: '足球', what: '球隊', draws: true,
    // ESPN's "all" path returns every competition; without "fixture=true" it gives played matches, with it, upcoming ones.
    teamUrls: (id) => [`${ESPN}/soccer/all/teams/${id}/schedule`, `${ESPN}/soccer/all/teams/${id}/schedule?fixture=true`],
    eventFields: (e, c) => {
      const slug = e.league?.slug || '';
      return { id: 's' + e.id, comp: slug, compName: COMP_NAMES[slug] || e.league?.name || slug, type: compType(slug),
        stage: e.seasonType?.name || '', clock: c.status?.displayClock || '' };
    },
    loadList: loadSoccerList,
    // Skip stage names that are just the season name (league matches).
    cardLabels: (e) => ({ comp: [e.compName, e.stage && !/^\d{4}/.test(e.stage) ? (STAGES[e.stage] || e.stage) : ''], foot: [e.venue] }),
  },
  nba: {
    key: 'nbaTeams', label: 'NBA', what: '球隊',
    // One request per season type (preseason, regular season, playoffs, play-in).
    teamUrls: (id) => [1, 2, 3, 5].map(t => `${ESPN}/basketball/nba/teams/${id}/schedule?seasontype=${t}`),
    eventFields: (e, c) => ({ id: 'n' + e.id, type: NBA_SEASON_TYPES[e.seasonType?.type] || 'regular', clock: c.status?.type?.shortDetail || '' }),
    loadList: loadConfList('basketball/nba'),
    cardLabels: (e) => ({ comp: [NBA_TYPES[e.type]], foot: [e.venue] }),
  },
  mlb: {
    key: 'mlbTeams', label: 'MLB', what: '球隊',
    // Regular season and postseason of this year (spring training is left out).
    // From August, next year's regular season too: it is published before the season ends.
    teamUrls: (id) => {
      const d = tw(Date.now()), y = d.getUTCFullYear();
      const url = (type, season) => `${ESPN}/baseball/mlb/teams/${id}/schedule?seasontype=${type}&season=${season}`;
      return [url(2, y), url(3, y), ...(d.getUTCMonth() >= 7 ? [url(2, y + 1)] : [])];
    },
    eventFields: (e, c) => ({ id: 'mlb' + e.id, type: e.seasonType?.type, note: c.notes?.[0]?.headline || '', clock: c.status?.type?.shortDetail || '' }),
    loadList: loadConfList('baseball/mlb'),
    cardLabels: (e) => ({ comp: [MLB_TYPES[e.type], mlbNote(e.note)], foot: [e.venue] }),
  },
  nfl: {
    key: 'nflTeams', label: 'NFL', what: '球隊', draws: true,
    // One request per season type (preseason, regular season, playoffs).
    teamUrls: (id) => [1, 2, 3].map(t => `${ESPN}/football/nfl/teams/${id}/schedule?seasontype=${t}`),
    eventFields: (e, c) => ({ id: 'nfl' + e.id, week: e.week?.text || '', clock: c.status?.type?.shortDetail || '' }),
    loadList: loadConfList('football/nfl'),
    cardLabels: (e) => ({ comp: [nflWeek(e.week)], foot: [e.venue] }),
  },
  tennis: {
    key: 'tennisPlayers', label: '網球', what: '選手',
    loadList: loadTennisList,
    cardLabels: (e) => ({ comp: [e.tournament, TENNIS_ROUNDS[e.round] || e.round], foot: ['單打', e.venue] }),
  },
};
const FOLLOW_KEYS = Object.values(FOLLOW).map(f => f.key);
const TEAM_SOURCES = Object.keys(FOLLOW).filter(s => FOLLOW[s].teamUrls);
const EVENT_SOURCES = [...Object.keys(FOLLOW), 'f1'];

// Tabs of the filter pop-up, one per kind of sport (in this order). Each league names its data source;
// a league with "divisions" gets a division dropdown. The league dropdown is shown only when a tab has several leagues.
// The key of a division, or of a league without divisions, is the "group" stored with a followed item.
//   leagueWord / divisionWord: what the dropdowns choose, used in the picker heading
const leaguesOf = (source, names) => Object.fromEntries(Object.entries(names).map(([k, name]) => [k, { name, source }]));
const SPORT_TABS = {
  soccer: { label: '足球', what: '球隊', leagueWord: '聯賽', leagues: leaguesOf('soccer', PICKER_LEAGUES) },
  basketball: { label: '籃球', what: '球隊', leagueWord: '聯盟', divisionWord: '分區', leagues: { nba: { name: 'NBA', source: 'nba', divisions: NBA_CONFS } } },
  baseball: { label: '棒球', what: '球隊', leagueWord: '聯盟', divisionWord: '聯盟', leagues: { mlb: { name: 'MLB', source: 'mlb', divisions: MLB_LEAGUES } } },
  football: { label: '美式足球', what: '球隊', leagueWord: '聯盟', divisionWord: '聯會', leagues: { nfl: { name: 'NFL', source: 'nfl', divisions: NFL_CONFS } } },
  tennis: { label: '網球', what: '選手', leagueWord: '巡迴賽', ranked: true, leagues: leaguesOf('tennis', TENNIS_TOURS) },
  f1: { label: 'F1' },
};
const PICK_TABS = Object.keys(SPORT_TABS).filter(t => SPORT_TABS[t].leagues);
const tabLeagues = (tab) => Object.entries(SPORT_TABS[tab].leagues);
const tabSources = (tab) => [...new Set(tabLeagues(tab).map(([, l]) => l.source))];
// Groups of one league: its divisions, or the league itself.
const leagueGroups = (key, league) => Object.keys(league.divisions || { [key]: league.name });
// Every group of a tab as [source, group].
const tabGroups = (tab) => tabLeagues(tab).flatMap(([k, l]) => leagueGroups(k, l).map(g => [l.source, g]));
// Name of a group: GROUP_NAMES[source][group]. A division also names its league once a tab has several.
const GROUP_NAMES = {};
for (const tab of PICK_TABS) {
  for (const [k, l] of tabLeagues(tab)) {
    const names = GROUP_NAMES[l.source] ??= {};
    for (const g of leagueGroups(k, l)) {
      const own = l.divisions ? l.divisions[g] : l.name;
      names[g] = l.divisions && tabLeagues(tab).length > 1 ? `${l.name} ${own}` : own;
    }
  }
}

// Standings sidebar: soccer competitions that have a table (domestic cups are knockouts — no table).
const STANDINGS_SOCCER = { ...PICKER_LEAGUES, 'uefa.champions': '歐冠（聯賽階段）', 'uefa.europa': '歐霸（聯賽階段）', 'uefa.europa.conf': '歐協聯（聯賽階段）' };
const STANDINGS_TENNIS_TOP = 20;   // tennis shows the top 20 plus followed players
const STANDINGS_SUB = {            // second-level switch per sport (soccer uses a dropdown instead)
  nba: NBA_CONFS,
  mlb: MLB_LEAGUES,
  nfl: NFL_CONFS,
  tennis: TENNIS_TOURS,
  f1: { drivers: '車手', constructors: '車隊' },
};

// Chinese names, used only by the picker search (ESPN gives English names only; the display stays English).
// Tennis and NBA: Wikipedia zh-tw titles plus common Taiwan names. Soccer: common Taiwan names, hand-written.
// Keyed by ESPN's English name. Teams or players missing here can still be found in English.
const ZH_NAMES = {};
const zhFiles = {};   // source -> promise of its zh-<source>.js, loaded the first time a search opens
function loadZhNames(source) {
  return zhFiles[source] ??= new Promise((done) => {
    const el = document.createElement('script');
    el.src = `zh-${source}.js`;
    el.onload = done;
    el.onerror = () => { delete zhFiles[source]; done(); };   // English search still works; the next search retries
    document.head.append(el);
  });
}

// Emoji shown before the sport name on each match card.
const SPORT_EMOJI = { '足球': '⚽', '籃球': '🏀', 'NBA': '🏀', '棒球': '⚾', 'MLB': '⚾', '美式足球': '🏈', 'NFL': '🏈', '網球': '🎾', 'F1': '🏎️' };
// Outline funnel icon for the filter button and dialog title (uses the current text color).
const FILTER_ICON = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.6V19l-3.6-1.8v-4.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const SEARCH_ICON = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// =====================================================================
// Helpers
// =====================================================================
const TW_OFFSET_MS = 8 * 3600 * 1000;
const DAY_MS = 24 * 3600 * 1000;
const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
const STORE_KEY = 'matchSchedule.v2';
const EVENTS_KEY = 'matchSchedule.events.';     // + source: cached schedule of one sport
const STANDINGS_KEY = 'matchSchedule.standings';
// How long fetched data counts as fresh. "↻ 更新" always fetches.
const FRESH_MS = 15 * 60 * 1000;          // teams with a match in the next FRESH_AHEAD_MS, and tennis
const FRESH_AHEAD_MS = 14 * 24 * 3600 * 1000;
const FRESH_IDLE_MS = 24 * 3600 * 1000;   // teams with nothing coming up, and the F1 calendar
const JUST_ENDED_MS = 4 * 3600 * 1000;    // a match that started this recently may have just finished
const FRESH_STANDINGS_MS = 3600 * 1000;
const KEEP_PAST_MS = 30 * 24 * 3600 * 1000;   // finished matches kept in storage
const MAX_PARALLEL_TEAMS = 6;
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports';
const ESPN_STANDINGS = 'https://site.api.espn.com/apis/v2/sports';

// Shift a UTC timestamp so getUTC* methods return Taiwan wall-clock values.
const tw = (ms) => new Date(ms + TW_OFFSET_MS);
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Longest custom range allowed (one tab per day, so keep it manageable).
const MAX_RANGE_DAYS = 62;

// UTC ms of 00:00 Taiwan time on the day containing `ms`.
function dayStartOf(ms) {
  const d = tw(ms);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - TW_OFFSET_MS;
}

// UTC ms of Monday 00:00 Taiwan time for the week containing `ms`.
function weekStartOf(ms) {
  const dayIdx = (tw(ms).getUTCDay() + 6) % 7; // Monday = 0
  return dayStartOf(ms) - dayIdx * DAY_MS;
}

// <input type="date"> uses "YYYY-MM-DD"; convert to/from Taiwan-midnight timestamps.
const toInputDate = (ms) => { const d = tw(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
function fromInputDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d) - TW_OFFSET_MS;
}
// ESPN "dates" query format (UTC calendar date): YYYYMMDD
const ymd = (ms) => { const d = new Date(ms); return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}`; };

function inWindow(ms) {
  const d = tw(ms);
  const m = d.getUTCHours() * 60 + d.getUTCMinutes();
  const { winStart: a, winEnd: b } = state.filters;
  // A window like 06:00–01:30 wraps past midnight; 09:00–23:00 does not.
  return a <= b ? m >= a && m <= b : m >= a || m <= b;
}
// Minutes since midnight <-> "HH:MM" (used by the time inputs and the header text)
const minToHM = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
// The kickoff window is chosen in 30-minute steps; older saved values are snapped to the nearest step.
const WIN_STEP = 30;
const snapWin = (m) => (Math.round((Number(m) || 0) / WIN_STEP) * WIN_STEP) % (24 * 60);
const WIN_OPTIONS = Array.from({ length: 24 * 60 / WIN_STEP }, (_, i) => i * WIN_STEP);

function fmtDate(ms) {
  const d = tw(ms);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}（${WEEKDAYS[d.getUTCDay()]}）`;
}
const fmtWeekday = (ms) => `週${WEEKDAYS[tw(ms).getUTCDay()]}`;
const fmtTime = (ms) => { const d = tw(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };

// League slugs look like "eng.1"; friendlies contain "friendly" (or are pre-season trophies);
// everything else (domestic cups, super cups, UEFA competitions) counts as a cup.
function compType(slug) {
  if (/^[a-z]{3}\.\d$/.test(slug)) return 'league';
  if (/friendly|joan_gamper/.test(slug)) return 'friendly';
  return 'cup';
}

// localStorage may be unavailable (private mode etc.) — never let it break the page.
// Settings and each sport's schedule are stored under separate keys, so a full schedule can never block the settings.
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveStore(patch) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...loadStore(), ...patch })); }
  catch { state.settingsUnsaved = true; }
}

// Cached schedule of one sport: { at, from, to, events }.
//   at:       when each item was last fetched (team id, 'all' for tennis, year for F1)
//   from, to: the period the cache is complete for (to = null means open-ended)
function loadEvents(source) {
  try {
    const c = JSON.parse(localStorage.getItem(EVENTS_KEY + source));
    if (c) return { at: c.at || {}, cover: { from: c.from, to: c.to ?? Infinity }, events: c.events || [] };
  } catch {}
  return { at: {}, cover: null, events: [] };
}

// Store a sport's schedule, keeping less when the browser's storage is full.
// Older matches and far-away dates are fetched again when someone asks for them.
function saveEvents(source) {
  const now = Date.now();
  const cfg = FOLLOW[source];
  const kept = cfg ? state[source].filter(e => follows(cfg.key, e.home.id) || follows(cfg.key, e.away.id)) : state[source];
  const base = coverBase(source);
  const attempts = [
    [source === 'f1' ? 0 : now - KEEP_PAST_MS, Infinity],
    [now - 7 * DAY_MS, Infinity],
    [now - 7 * DAY_MS, now + 30 * DAY_MS],
  ];
  for (const [a, b] of attempts) {
    const from = Math.max(a, base.from), to = Math.min(b, base.to);
    const events = kept.filter(e => e.start >= from && e.start < to);
    try {
      localStorage.setItem(EVENTS_KEY + source, JSON.stringify({ at: state.fetchAt[source], from, to, events }));
      state.cover[source] = { from, to };
      state.eventsUnsaved.delete(source);
      return;
    } catch {}
  }
  try { localStorage.removeItem(EVENTS_KEY + source); } catch {}
  state.eventsUnsaved.add(source);
}

// The period the data in memory can be trusted for when it is stored again.
function coverBase(source) {
  const open = { from: 0, to: Infinity };
  const c = state.cover[source];
  const cfg = FOLLOW[source];
  // Tennis is fetched by date, so nothing is known until a period has been fetched.
  if (!c) return cfg && !cfg.teamUrls ? { from: 0, to: 0 } : open;
  return cfg?.teamUrls && state[cfg.key].every(t => state.fullIds.has(t.id)) ? open : c;
}

// Merge new events into a list by id (an event shared by two followed teams is kept once).
function mergeById(base, events) {
  const byId = new Map(base.map(e => [e.id, e]));
  for (const e of events) byId.set(e.id, e);
  return [...byId.values()];
}

// =====================================================================
// State
// =====================================================================
const DEFAULT_FILTERS = {
  f1On: false,
  f1Cats: Object.keys(F1_CATEGORIES),
  winStart: WINDOW_START_MIN,
  winEnd: WINDOW_END_MIN,
};

// Followed items are {id, name, group, logo}. Older soccer entries used "league" instead of "group".
const cleanFollowList = (list) => (Array.isArray(list) ? list : [])
  .filter(t => t && typeof t.id === 'string' && typeof t.name === 'string')
  .map(t => ({ id: t.id, name: LEGACY_NAMES[t.id] || t.name, group: String(t.group || t.league || ''), logo: String(t.logo || '') }));

const stored = loadStore();
const cachedEvents = Object.fromEntries(EVENT_SOURCES.map(s => [s, loadEvents(s)]));
// Older versions kept the schedules inside the settings; used once below, then moved out.
const legacyEvents = EVENT_SOURCES.filter(s => Array.isArray(stored[s]));

// Remembered dropdown choices of one tab; anything no longer offered falls back to the first option.
function initialPick(tab, league, division) {
  const leagues = SPORT_TABS[tab].leagues;
  const key = leagues[league] ? league : Object.keys(leagues)[0];
  const divisions = Object.keys(leagues[key].divisions || {});
  return { league: key, division: divisions.includes(division) ? division : (divisions[0] || null) };
}
// Dropdown choices saved by older versions: tab -> [league, division]
const LEGACY_PICK = {
  soccer: [stored.pickGroup?.soccer ?? stored.pickerLeague],
  basketball: [undefined, stored.pickGroup?.nba],
  tennis: [stored.pickGroup?.tennis],
};

const state = {
  // Date range shown as tabs (Taiwan-midnight timestamps, end day inclusive). Defaults to this week.
  rangeStart: weekStartOf(Date.now()),
  rangeEnd: weekStartOf(Date.now()) + 6 * DAY_MS,
  selectedDay: dayStartOf(Date.now()),
  sportTab: 'soccer',                         // sport tab shown in the filter pop-up
  // Followed teams / players
  ...Object.fromEntries(FOLLOW_KEYS.map(k => [k, cleanFollowList(stored[k])])),
  // Normalized events per source
  ...Object.fromEntries(EVENT_SOURCES.map(s => [s, legacyEvents.includes(s) ? stored[s] : cachedEvents[s].events])),
  fetchAt: Object.fromEntries(EVENT_SOURCES.map(s => [s, cachedEvents[s].at])),
  cover: Object.fromEntries(EVENT_SOURCES.map(s => [s, cachedEvents[s].cover])),
  fullIds: new Set(),                         // teams fetched since opening, so not limited to what storage kept
  fetchedAt: stored.fetchedAt || null,
  loading: false,
  errors: [],
  eventsUnsaved: new Set(),                   // sports that did not fit in the browser's storage
  settingsUnsaved: false,
  // Picker: dropdown choices per tab, and loaded lists: pickLists[source][group] = [...]
  pick: Object.fromEntries(PICK_TABS.map(t => [t, initialPick(t,
    stored.pick?.[t]?.league ?? LEGACY_PICK[t]?.[0], stored.pick?.[t]?.division ?? LEGACY_PICK[t]?.[1])])),
  pickLists: Object.fromEntries(Object.keys(FOLLOW).map(s => [s, {}])),
  filters: { ...DEFAULT_FILTERS, ...(stored.filters || {}) },
};
// "showLate" was removed (the kickoff window replaces it); snap old free-form times to 30-minute steps.
for (const k of ['showLate', 'types', 'nbaTypes']) delete state.filters[k];   // options that no longer exist
state.filters.winStart = snapWin(state.filters.winStart);
state.filters.winEnd = snapWin(state.filters.winEnd);
const follows = (key, id, src = state) => src[key].some(t => t.id === id);
const followCount = (src = state) => FOLLOW_KEYS.reduce((n, k) => n + src[k].length, 0);

if (legacyEvents.length) {
  const settings = { ...stored };
  for (const s of legacyEvents) delete settings[s];
  try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch {}
  legacyEvents.forEach(saveEvents);
}

// =====================================================================
// Data fetching
// =====================================================================
async function getJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Runs tasks with at most `limit` of them in flight, so a long follow list fills in steadily.
async function runLimited(tasks, limit) {
  let next = 0;
  const worker = async () => { while (next < tasks.length) await tasks[next++](); };
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
}

// Full schedule of one followed team. `complete` is false when only some of its requests worked.
async function fetchTeamSchedule(source, team) {
  const results = await Promise.allSettled(FOLLOW[source].teamUrls(team.id).map(getJSON));
  if (results.every(r => r.status !== 'fulfilled')) throw new Error(team.name);
  return {
    list: results.flatMap(r => r.status === 'fulfilled' ? (r.value.events || []) : []).map(e => normalizeTeamGame(e, source)),
    complete: results.every(r => r.status === 'fulfilled'),
  };
}

// Soccer, NBA, MLB and NFL games share ESPN's event format.
function normalizeTeamGame(e, sport) {
  const c = e.competitions?.[0] || {};
  const side = (homeAway) => {
    const t = (c.competitors || []).find(x => x.homeAway === homeAway) || {};
    return {
      id: t.team?.id || '',
      name: t.team?.displayName || '?',
      logo: t.team?.logos?.[0]?.href || t.team?.logo || '',
      score: t.score?.displayValue ?? (typeof t.score === 'string' ? t.score : null),
      winner: t.winner === true,       // also set for wins on penalties
    };
  };
  const st = c.status?.type || {};
  return {
    start: Date.parse(e.date),
    timeValid: e.timeValid !== false,
    home: side('home'),
    away: side('away'),
    state: st.state || 'pre',          // pre / in / post
    statusName: st.name || '',
    statusText: st.shortDetail || st.description || '',
    venue: c.venue?.fullName || '',
    kind: sport,
    ...FOLLOW[sport].eventFields(e, c),
  };
}

// Tennis: one scoreboard request per tour for the whole date range; it lists every tournament
// in that period with all of its matches. Only singles matches of followed players are kept.
async function fetchTennis(players, from, to) {
  const tours = [...new Set(players.map(p => p.group))].filter(t => TENNIS_TOURS[t]);
  const ids = new Set(players.map(p => p.id));
  const list = [];
  const failed = [];
  await Promise.all(tours.map(async (tour) => {
    try {
      // One extra day on each side: ESPN groups matches by US date.
      const d = await getJSON(`${ESPN}/tennis/${tour}/scoreboard?dates=${ymd(from - DAY_MS)}-${ymd(to + DAY_MS)}`);
      for (const ev of d.events || []) {
        for (const g of ev.groupings || []) {
          if (!/Singles/.test(g.grouping?.displayName || '')) continue;
          for (const c of g.competitions || []) {
            if ((c.competitors || []).some(x => ids.has(x.id))) list.push(normalizeTennis(ev, c));
          }
        }
      }
    } catch { failed.push(`網球 ${TENNIS_TOURS[tour]}`); }
  }));
  return { list, failed, allFailed: tours.length > 0 && failed.length === tours.length };
}

function normalizeTennis(ev, c) {
  const players = [...(c.competitors || [])].sort((a, b) => (a.order || 0) - (b.order || 0));
  const sets = (p) => (p.linescores || []).map(s => s.value);
  const [a, b] = [players[0] || {}, players[1] || {}];
  const sa = sets(a), sb = sets(b);
  // Sets won (for the big score) and the set-by-set line, e.g. "6-4 3-6 7-6(5)".
  const won = (x, y) => x.filter((v, i) => v > (y[i] ?? -1)).length;
  const setLine = sa.map((v, i) => {
    const tb = [a.linescores?.[i]?.tiebreak, b.linescores?.[i]?.tiebreak].filter(t => t != null);
    return `${v}-${sb[i] ?? ''}${tb.length ? `(${Math.min(...tb)})` : ''}`;
  }).join(' ');
  const setCols = (mine, theirs) => mine.map((v, i) => {
    const tb = [a.linescores?.[i]?.tiebreak, b.linescores?.[i]?.tiebreak].filter(t => t != null);
    return { v, tb: tb.length && v < (theirs[i] ?? -1) ? Math.min(...tb) : null };
  });
  const side = (p, score, cols) => ({
    id: p.id || '',
    sets: cols,
    name: p.athlete?.displayName || 'TBD',
    logo: p.athlete?.flag?.href || '',
    score: sa.length ? String(score) : null,
    winner: p.winner === true,
  });
  const st = c.status?.type || {};
  return {
    id: 't' + c.id,
    kind: 'tennis',
    start: Date.parse(c.date),
    timeValid: c.timeValid !== false,
    tournament: ev.name || '',
    round: c.round?.displayName || '',
    home: side(a, won(sa, sb), setCols(sa, sb)),
    away: side(b, won(sb, sa), setCols(sb, sa)),
    setLine,
    state: st.state || 'pre',
    statusName: st.name || '',
    statusText: st.shortDetail || st.description || '',
    clock: st.shortDetail || '',
    venue: ev.venue?.displayName || '',
  };
}

// Jolpica (community successor of the Ergast F1 API), one request per season.
async function fetchF1(years) {
  const out = [];
  const failed = [];
  for (const y of years) {
    try {
      const d = await getJSON(`https://api.jolpi.ca/ergast/f1/${y}.json?limit=100`);
      for (const race of d.MRData?.RaceTable?.Races || []) {
        for (const [key, [label, cat]] of Object.entries(F1_SESSIONS)) {
          const s = key === 'Race' ? { date: race.date, time: race.time } : race[key];
          if (!s?.date) continue;
          out.push({
            id: `f1-${y}-${race.round}-${key}`,
            kind: 'f1',
            start: Date.parse(`${s.date}T${s.time || '00:00:00Z'}`),
            timeValid: !!s.time,
            raceName: race.raceName,
            round: race.round,
            location: [race.Circuit?.Location?.locality, race.Circuit?.Location?.country].filter(Boolean).join(', '),
            session: label,
            cat,
          });
        }
      }
    } catch { failed.push(`F1 ${y} 賽程`); }
  }
  return { list: out, failed };
}

// A match in progress, or one that may have just finished or changed: its data can't count as fresh.
const hasOpenMatch = (events, now) => events.some(e => e.state === 'in' ||
  (e.start <= now && (e.start > now - JUST_ENDED_MS || (e.state === 'pre' && e.start > now - DAY_MS))));
// The chosen dates reach outside what the stored data covers.
function rangeOutsideCover(source) {
  const c = state.cover[source];
  return !c || state.rangeStart < c.from || state.rangeEnd + DAY_MS > c.to;
}
const teamEvents = (source, id) => state[source].filter(e => e.home.id === id || e.away.id === id);

function teamIsStale(source, team, now) {
  const at = state.fetchAt[source][team.id];
  if (!at || (!state.fullIds.has(team.id) && rangeOutsideCover(source))) return true;
  const events = teamEvents(source, team.id);
  if (hasOpenMatch(events, now)) return true;
  const soon = events.some(e => e.start > now && e.start <= now + FRESH_AHEAD_MS);
  return now - at >= (soon ? FRESH_MS : FRESH_IDLE_MS);
}

function tennisIsStale(now) {
  const at = state.fetchAt.tennis.all;
  return !at || rangeOutsideCover('tennis') || hasOpenMatch(state.tennis, now) || now - at >= FRESH_MS;
}

const f1YearIsStale = (y, now) => !state.fetchAt.f1[y] || rangeOutsideCover('f1') || now - state.fetchAt.f1[y] >= FRESH_IDLE_MS;

async function updateTeam(source, team) {
  const { list, complete } = await fetchTeamSchedule(source, team);
  // A team's new list replaces its old one, so cancelled fixtures disappear. Without all of it, only add.
  const base = complete ? state[source].filter(e => e.home.id !== team.id && e.away.id !== team.id) : state[source];
  state[source] = mergeById(base, list);
  state.fetchAt[source][team.id] = Date.now();
  state.fullIds.add(team.id);
}

async function updateTennis() {
  const from = state.rangeStart, to = state.rangeEnd + DAY_MS;
  const tn = await fetchTennis(state.tennisPlayers, from, to);
  state.errors.push(...tn.failed);
  if (tn.allFailed) return false;
  // With one tour failed, keep what is known about it instead of replacing the period.
  const base = tn.failed.length ? state.tennis : state.tennis.filter(e => e.start < from || e.start >= to);
  state.tennis = mergeById(base, tn.list);
  const c = state.cover.tennis;
  state.cover.tennis = c && c.from <= to && c.to >= from ? { from: Math.min(c.from, from), to: Math.max(c.to, to) } : { from, to };
  if (!tn.failed.length) state.fetchAt.tennis.all = Date.now();
  return true;
}

async function updateF1(years) {
  const f = await fetchF1(years);
  state.errors.push(...f.failed);
  const done = years.filter(y => !f.failed.includes(`F1 ${y} 賽程`));
  if (!done.length) return false;
  state.f1 = [...state.f1.filter(x => !done.includes(tw(x.start).getUTCFullYear())), ...f.list];
  done.forEach(y => { state.fetchAt.f1[y] = Date.now(); });
  return true;
}

// Show results as they arrive, without redrawing for every single team.
let renderTimer = null;
function renderSoon() {
  renderTimer ??= setTimeout(() => { renderTimer = null; render(); }, 200);
}

// Fetch what is out of date; `force` ("↻ 更新") fetches everything.
// Each sport shows up on its own, and one that fails does not hold back the others.
let refreshAgain = false;
async function refresh(force = false) {
  if (state.loading) { refreshAgain = true; return; }
  const now = Date.now();
  if (force) clearStandings();
  const teamJobs = TEAM_SOURCES.flatMap(s => state[FOLLOW[s].key]
    .filter(t => force || teamIsStale(s, t, now)).map(t => [s, t]));
  const tennisDue = state.tennisPlayers.length > 0 && (force || tennisIsStale(now));
  // F1: every season touched by the chosen range and the next two months.
  const years = state.filters.f1On ? neededF1Years().filter(y => force || f1YearIsStale(y, now)) : [];
  if (!teamJobs.length && !tennisDue && !years.length) { render(); return; }

  const btn = document.getElementById('refresh');
  btn.disabled = true; btn.textContent = '更新中…';
  state.loading = true;
  state.errors = [];
  const changed = new Set();
  const finished = (source) => (ok) => { if (ok) changed.add(source); renderSoon(); };
  try {
    await Promise.all([
      runLimited(teamJobs.map(([s, t]) => () => updateTeam(s, t)
        .then(() => finished(s)(true), () => { state.errors.push(t.name); renderSoon(); })), MAX_PARALLEL_TEAMS),
      tennisDue ? updateTennis().then(finished('tennis')) : null,
      years.length ? updateF1(years).then(finished('f1')) : null,
    ]);
    if (changed.size) {
      state.fetchedAt = Date.now();
      saveStore({ fetchedAt: state.fetchedAt });
      changed.forEach(saveEvents);
    }
  } finally {
    state.loading = false;
    btn.disabled = false; btn.textContent = '↻ 更新';
    render();
  }
  if (refreshAgain) { refreshAgain = false; refresh(); }
}

// Picker list of one group: soccer league teams, NBA / MLB / NFL conference teams, or tennis rankings.
// Team lists come from the standings endpoint because ESPN's /teams endpoint blocks browser requests (no CORS header).
const standingsTeams = (entries) => (entries || [])
  .map(x => ({ id: x.team.id, name: x.team.displayName, logo: x.team.logos?.[0]?.href || '' }))
  .sort((a, b) => a.name.localeCompare(b.name));

async function loadSoccerList(group, lists) {
  const d = await getJSON(`${ESPN_STANDINGS}/soccer/${group}/standings`);
  // Leagues split into conferences (e.g. MLS) have several "children" tables.
  lists[group] = standingsTeams((d.children || []).flatMap(c => c.standings?.entries || []));
}

// Leagues split in two (NBA, MLB, NFL): one standings request fills both groups of the sport.
function loadConfList(path) {
  return async (group, lists) => {
    const d = await getJSON(`${ESPN_STANDINGS}/${path}/standings`);
    const groups = Object.keys(STANDINGS_SUB[path.split('/')[1]]);
    for (const c of d.children || []) {
      const key = groups.find(g => CONF_TABLES[g].test(c.name || ''));
      if (key) lists[key] = standingsTeams(c.standings?.entries);
    }
    if (!lists[group]) throw new Error('missing conference');
  };
}

async function loadTennisList(group, lists) {
  // Current singles ranking (top 150), kept in ranking order.
  const d = await getJSON(`${ESPN}/tennis/${group}/rankings`);
  lists[group] = (d.rankings?.[0]?.ranks || []).map(r => ({
    id: r.athlete.id, name: r.athlete.displayName, rank: r.current,
    logo: typeof r.athlete.flag === 'string' ? r.athlete.flag : (r.athlete.flag?.href || ''),
  }));
}

async function loadPickList(source, group) {
  const lists = state.pickLists[source];
  if (lists[group]) return;
  try {
    await FOLLOW[source].loadList(group, lists);
  } catch {
    lists[group] = null; // null = failed, allow retry
  }
}

// =====================================================================
// Filter pop-up: draft handling
// =====================================================================
// While the pop-up is open, every change goes into this draft copy.
// "完成" applies the draft; "取消" (or Esc) throws it away.
let draft = null;          // { tracked, nbaTeams, tennisPlayers, filters } or null when the pop-up is closed
let openSnapshot = null;   // settings fingerprint at the moment the pop-up was opened
const pickSearch = Object.fromEntries(PICK_TABS.map(t => [t, '']));   // text typed in each search box
const view = () => draft || state;   // what the pop-up shows

const copySettings = (src) => ({
  ...Object.fromEntries(FOLLOW_KEYS.map(k => [k, [...src[k]]])),
  filters: JSON.parse(JSON.stringify(src.filters)),
});

// Comparable fingerprint of a settings object (arrays sorted, so ticking a box off and on again counts as no change).
function settingsSnapshot(src) {
  const f = src.filters;
  return JSON.stringify({
    ...Object.fromEntries(FOLLOW_KEYS.map(k => [k, src[k].map(t => t.id).sort()])),
    f1On: f.f1On, f1Cats: [...f.f1Cats].sort(), winStart: f.winStart, winEnd: f.winEnd,
  });
}
const isDirty = () => !!draft && settingsSnapshot(draft) !== openSnapshot;

// Apply confirmed settings: drop events of unfollowed teams/players, then fetch what is missing.
async function applySettings(d) {
  const tennisAdded = d.tennisPlayers.some(p => !follows('tennisPlayers', p.id));
  for (const k of FOLLOW_KEYS) state[k] = d[k];
  state.filters = d.filters;
  for (const [source, cfg] of Object.entries(FOLLOW)) {
    state[source] = state[source].filter(e => follows(cfg.key, e.home.id) || follows(cfg.key, e.away.id));
  }
  for (const source of TEAM_SOURCES) {
    const at = state.fetchAt[source];
    for (const id of Object.keys(at)) if (!follows(FOLLOW[source].key, id)) { delete at[id]; state.fullIds.delete(id); }
  }
  if (tennisAdded) { state.fetchAt.tennis = {}; state.cover.tennis = null; }
  saveStore(Object.fromEntries([...FOLLOW_KEYS, 'filters'].map(k => [k, state[k]])));
  Object.keys(FOLLOW).forEach(saveEvents);
  renderFilters(); render();
  await refresh();
}

function chip(group, value, label, checked, logo = '', sport = '', rank = null, groupLabel = '') {
  const img = logo ? `<img src="${esc(logo)}" alt="" loading="lazy">` : '';
  const r = rank != null ? `<span class="rank">#${esc(rank)}</span>` : '';
  return `<label class="chip ${checked ? 'on' : ''}"><input type="checkbox" data-group="${group}" data-sport="${sport}" value="${esc(value)}" ${checked ? 'checked' : ''}>${img}${r}${esc(label)}${groupLabel ? `<span class="group">${esc(groupLabel)}</span>` : ''}</label>`;
}

// Tabs and one panel per sport, built once from SPORT_TABS.
function buildSportPanels() {
  document.getElementById('sportTabs').innerHTML = Object.entries(SPORT_TABS).map(([s, t]) =>

      <div class="fgroup">
